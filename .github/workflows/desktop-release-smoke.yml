name: Desktop Release Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - "server/**"
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "playwright.config.ts"
  pull_request:
    paths:
      - "desktop/**"
      - "server/**"
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "playwright.config.ts"

permissions:
  contents: read

jobs:
  preflight:
    name: release-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Electron binary
        run: npm run electron:install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Apple native contract tests
        run: npm run test:apple-native

      - name: CloudKit relay lifecycle tests
        env:
          NODE_OPTIONS: --experimental-sqlite
        run: npm run test:relay-lifecycle

      - name: CloudKit relay schedule and concurrency tests
        env:
          NODE_OPTIONS: --experimental-sqlite
        run: npm run test:relay-schedule

      - name: Unit and API tests
        env:
          NODE_OPTIONS: --experimental-sqlite
        run: npm test

      - name: E2E tests
        env:
          NODE_OPTIONS: --experimental-sqlite
        run: npm run test:e2e

      - name: Desktop smoke tests
        env:
          NODE_OPTIONS: --experimental-sqlite
          ELECTRON_DISABLE_SANDBOX: "1"
        run: xvfb-run -a npm run test:desktop

      - name: Remote connection mock smoke
        env:
          NODE_OPTIONS: --experimental-sqlite
        run: npm run remote:mock-smoke

      - name: Unsigned release check
        env:
          NODE_OPTIONS: --experimental-sqlite
          LIFEOS_RELEASE_SKIP_ARTIFACTS: "1"
        run: npm run release:check:unsigned

  desktop-release-smoke:
    name: ${{ matrix.os }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk-bridge2.0-0 libgtk-3-0 libxss1 libasound2t64 libgbm1 libxshmfence1 xvfb

      - name: Install Electron binary
        run: npm run electron:install

      - name: Resolve Windows Node binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "LIFEOS_NODE_BINARY=$((Get-Command node).Source)" >> $env:GITHUB_ENV

      - name: Desktop release smoke
        if: runner.os != 'Linux'
        env:
          NODE_OPTIONS: --experimental-sqlite
          LIFEOS_RELEASE_SMOKE_FAST: "1"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ELECTRON_DISABLE_SANDBOX: "1"
        run: npm run desktop:release:smoke

      - name: Desktop release smoke (Linux)
        if: runner.os == 'Linux'
        env:
          NODE_OPTIONS: --experimental-sqlite
          LIFEOS_RELEASE_SMOKE_FAST: "1"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ELECTRON_DISABLE_SANDBOX: "1"
        run: xvfb-run -a npm run desktop:release:smoke

      - name: Packaged app launch smoke
        if: runner.os == 'macOS'
        env:
          NODE_OPTIONS: --experimental-sqlite
          LIFEOS_ARTIFACT_SMOKE_LAUNCH: "1"
        run: npm run desktop:artifact:smoke:launch

      - name: Packaged app launch smoke (Windows)
        if: runner.os == 'Windows'
        env:
          NODE_OPTIONS: --experimental-sqlite
          LIFEOS_ARTIFACT_SMOKE_LAUNCH: "1"
          ELECTRON_DISABLE_SANDBOX: "1"
        run: node scripts/desktop-artifact-smoke.mjs

      - name: Packaged app launch smoke (Linux)
        if: runner.os == 'Linux'
        env:
          NODE_OPTIONS: --experimental-sqlite
          LIFEOS_ARTIFACT_SMOKE_LAUNCH: "1"
          ELECTRON_DISABLE_SANDBOX: "1"
        run: xvfb-run -a node scripts/desktop-artifact-smoke.mjs
